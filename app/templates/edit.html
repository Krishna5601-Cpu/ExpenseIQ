{% extends "base.html" %} {% block title %}Edit Expense{% endblock %} {% block
content %}

<section class="max-w-3xl mx-auto">
  <!-- HERO -->

  <div class="mb-8 rounded-3xl bg-gradient-to-r from-indigo-600 to-blue-600 p-8 text-white shadow-xl">
    <p class="text-sm uppercase tracking-[0.3em] text-indigo-100">
      Expense Management
    </p>

    <h1 class="mt-2 text-4xl font-bold">Edit Expense</h1>

    <p class="mt-3 text-indigo-100">
      Update your expense details and keep your records accurate.
    </p>
  </div>

  <!-- CARD -->

  <div
    class="rounded-3xl border border-slate-200 bg-white p-8 shadow-lg transition-colors dark:border-slate-700 dark:bg-slate-800">
    <form action="{{ url_for('expense.update_expense', expense_id=expense.id) }}" method="POST" class="space-y-6">
      <!-- Amount -->

      <div>
        <label for="amount" class="mb-2 block font-semibold"> Amount </label>

        <input id="amount" name="amount" type="number" value="{{ expense.amount }}" required
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-900" />
      </div>

      <!-- Category -->

      <div>
        <label for="category" class="mb-2 block font-semibold">
          Category
        </label>

        {% set categories = [ "food", "travel", "shopping", "health", "bills",
        "entertainment" ] %}

        <select id="category" name="category" required
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-900">
          {% for category in categories %}

          <option value="{{ category }}" {% if expense.category|lower=""="category" %}selected{% endif %}>
            {{ category.title() }}
          </option>

          {% endfor %}
        </select>
      </div>

      <!-- Description -->

      <div>
        <label for="description" class="mb-2 block font-semibold">
          Description
        </label>

        <textarea id="description" name="description" rows="4"
          class="w-full resize-none rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-900">
{{ expense.description }}</textarea>
      </div>

      <!-- Date -->

      <div>
        <label for="date" class="mb-2 block font-semibold"> Date </label>

        <input id="date" name="date" type="date" value="{{ expense.date }}" required
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-900" />
      </div>

      <!-- Buttons -->

      <div class="flex flex-col gap-4 pt-2 sm:flex-row">
        <button type="submit"
          class="flex-1 rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-700">
          💾 Save Changes
        </button>

        <a href="{{ url_for('main.home') }}"
          class="flex-1 rounded-xl border border-slate-300 py-3 text-center font-semibold transition hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
